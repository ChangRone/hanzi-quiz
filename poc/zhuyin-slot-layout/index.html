<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注音完整位置 PoC</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#172033;background:#f5f7fb}
body{margin:0;padding:22px}.wrap{max-width:980px;margin:auto}.panel{background:white;border:1px solid #dde3ee;border-radius:18px;padding:18px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 8px}.muted{color:#667085;line-height:1.6}.examples,.palette{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px 12px;font-size:16px;cursor:pointer}
.work{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;margin:24px 0}
.hanzi{width:180px;height:180px;border:2px solid #94a3b8;display:grid;place-items:center;font-size:92px;border-radius:8px}
.zhuyin-shell{position:relative;width:92px;height:220px;margin-right:64px}
.zhuyin-box{width:92px;height:220px;border:2px solid #64748b;border-radius:8px;display:grid;grid-template-rows:1fr 1fr 1fr;overflow:hidden;background:#fff}
.slot{display:grid;place-items:center;font-size:38px;border-bottom:1px dashed #cbd5e1;position:relative;user-select:none}
.slot:last-child{border-bottom:0}.slot.selected{box-shadow:inset 0 0 0 3px #5b8def}.slot.ok{background:#ecfdf3}.slot.bad{background:#fff0f0}
.slot .pos{position:absolute;left:4px;top:3px;font-size:10px;color:#98a2b3}
.neutral-slot,.tone-slot{position:absolute;border:1.5px dashed #94a3b8;border-radius:7px;width:38px;height:32px;display:grid;place-items:center;font-size:28px;background:#fff;user-select:none}
.neutral-slot{left:27px;top:-38px}.neutral-slot::after{content:"輕";position:absolute;left:-22px;font-size:10px;color:#98a2b3}
.tone-slot{left:104px;top:156px}.tone-slot::after{content:"調";position:absolute;left:42px;font-size:10px;color:#98a2b3}
.neutral-slot.selected,.tone-slot.selected{box-shadow:0 0 0 3px #5b8def}.neutral-slot.ok,.tone-slot.ok{background:#ecfdf3}.neutral-slot.bad,.tone-slot.bad{background:#fff0f0}
.guide .expected-slot{background:#f0f6ff}.guide .expected-empty{background:repeating-linear-gradient(135deg,#fff,#fff 8px,#f8fafc 8px,#f8fafc 16px)}
.status{min-height:48px;padding:12px;border-radius:10px;background:#f8fafc;line-height:1.6}.meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.small{font-size:13px}.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.legend div{padding:10px;border:1px solid #e2e8f0;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>注音完整位置 PoC</h1>
    <div class="muted">每題永遠顯示完整注音位置；學生必須把符號寫在正確位置，該空的位置也必須保持空白。這版先驗證位置與判分規則，尚未接手寫筆畫辨識。</div>
  </div>
  <div class="panel">
    <b>選例字：</b><div class="examples" id="examples"></div>
    <div class="controls"><button id="guideBtn">位置提示：關</button><button id="resetBtn">清空</button><button id="checkBtn">判定</button></div>
    <div class="work" id="work">
      <div class="hanzi" id="hanzi">貓</div>
      <div class="zhuyin-shell">
        <div class="neutral-slot" data-slot="neutral"></div>
        <div class="zhuyin-box">
          <div class="slot" data-slot="s0"><span class="pos">上</span></div>
          <div class="slot" data-slot="s1"><span class="pos">中</span></div>
          <div class="slot" data-slot="s2"><span class="pos">下</span></div>
        </div>
        <div class="tone-slot" data-slot="tone"></div>
      </div>
    </div>
    <div class="small muted">先點位置，再從下方選符號；空白位置什麼都不要填。</div>
    <div class="palette" id="palette"></div><div class="status" id="status">尚未判定。</div>
  </div>
  <div class="panel">
    <b>位置規則</b>
    <div class="legend">
      <div><b>1 個符號</b><br>中位；上、下位呈現但留白。</div>
      <div><b>2 個符號</b><br>上、下位；中位呈現但留白。</div>
      <div><b>3 個符號</b><br>上、中、下三位。</div>
      <div><b>二／三／四聲</b><br>調號在最後符號右上方。</div>
      <div><b>一聲</b><br>調號位置存在，但答案留白。</div>
      <div><b>輕聲</b><br>使用上方輕聲位；一般調號位留白。</div>
    </div>
    <p class="muted">正式手寫版不顯示答案，只保留淡化定位格；判分以「符號 + slot」為準。</p>
    <div class="meta" id="meta"></div>
  </div>
</div>
<script>
const cases=[{label:'貓',char:'貓',zhuyin:'ㄇㄠ'},{label:'巷',char:'巷',zhuyin:'ㄒㄧㄤˋ'},{label:'小',char:'小',zhuyin:'ㄒㄧㄠˇ'},{label:'一',char:'一',zhuyin:'ㄧ'},{label:'叔',char:'叔',zhuyin:'ㄕㄨˊ'},{label:'叔・輕',char:'叔',zhuyin:'ㄕㄨ˙'}];
const bopomofo=['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ','ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ','ㄧ','ㄨ','ㄩ','ˊ','ˇ','ˋ','˙'];
let current=cases[0],selected='s0',guide=false,answer={s0:'',s1:'',s2:'',neutral:'',tone:''};
function parse(zh){const toneMark=[...zh].find(ch=>'ˊˇˋ˙'.includes(ch))||'';const syms=[...zh].filter(ch=>!'ˊˇˋ˙'.includes(ch));const slots=['','',''];if(syms.length===1)slots[1]=syms[0];else if(syms.length===2){slots[0]=syms[0];slots[2]=syms[1];}else if(syms.length===3){slots[0]=syms[0];slots[1]=syms[1];slots[2]=syms[2];}else throw new Error('PoC 僅支援 1~3 個符號');const lastRow=slots[2]?2:slots[1]?1:0;return{s0:slots[0],s1:slots[1],s2:slots[2],neutral:toneMark==='˙'?'˙':'',tone:'ˊˇˋ'.includes(toneMark)?toneMark:'',lastRow};}
const expected=()=>parse(current.zhuyin);
function render(){document.getElementById('hanzi').textContent=current.char;document.getElementById('work').classList.toggle('guide',guide);document.getElementById('guideBtn').textContent='位置提示：'+(guide?'開':'關');const exp=expected();document.querySelector('[data-slot="tone"]').style.top=([8,82,156][exp.lastRow]+2)+'px';document.querySelectorAll('[data-slot]').forEach(el=>{const k=el.dataset.slot;el.classList.toggle('selected',k===selected);el.classList.remove('ok','bad','expected-slot','expected-empty');const pos=el.querySelector('.pos');[...el.childNodes].forEach(n=>{if(n.nodeType===3)n.remove();});if(answer[k])el.appendChild(document.createTextNode(answer[k]));if(pos&&!el.contains(pos))el.prepend(pos);if(guide)el.classList.add(exp[k]?'expected-slot':'expected-empty');});document.getElementById('meta').textContent=JSON.stringify({char:current.char,canonicalZhuyin:current.zhuyin,expectedSlots:{upper:exp.s0||null,middle:exp.s1||null,lower:exp.s2||null,neutralToneTop:exp.neutral||null,normalToneRightOfLast:exp.tone||null},lastSymbolRow:exp.lastRow},null,2);}
function reset(){answer={s0:'',s1:'',s2:'',neutral:'',tone:''};document.getElementById('status').textContent='尚未判定。';render();}
function check(){const exp=expected(),keys=['s0','s1','s2','neutral','tone'];let ok=true,msgs=[];for(const k of keys){const el=document.querySelector('[data-slot="'+k+'"]'),got=answer[k]||'',want=exp[k]||'';if(got===want)el.classList.add('ok');else{ok=false;el.classList.add('bad');if(!want&&got)msgs.push(k+': 這個位置應留白');else if(want&&!got)msgs.push(k+': 缺少 '+want);else msgs.push(k+': 應為 '+want+'，目前是 '+got);}}document.getElementById('status').innerHTML=ok?'<b>PASS</b>：符號與位置都正確。':'<b>FAIL</b>：'+msgs.join('；');}
document.getElementById('examples').innerHTML=cases.map((c,i)=>'<button data-case="'+i+'">'+c.label+' '+c.zhuyin+'</button>').join('');
document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{current=cases[Number(b.dataset.case)];selected='s0';reset();});
document.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>{selected=el.dataset.slot;render();});
document.getElementById('palette').innerHTML=bopomofo.map(x=>'<button data-v="'+x+'">'+x+'</button>').join('')+'<button data-v="">清除</button>';
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{answer[selected]=b.dataset.v;render();});
document.getElementById('guideBtn').onclick=()=>{guide=!guide;render();};document.getElementById('resetBtn').onclick=reset;document.getElementById('checkBtn').onclick=check;render();
</script>
</body>
</html>
