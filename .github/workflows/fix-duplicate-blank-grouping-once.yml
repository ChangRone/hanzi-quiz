name: Fix duplicate blank grouping once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-duplicate-blank-grouping-once.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch duplicate blank grouping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/app.js')
          text = path.read_text(encoding='utf-8')

          old_queue = (
              "        const skill = skillOfQuestion(question);\n"
              "        const tokens = question.tokens.map(token => {\n"
              "          if (token.type !== 'blank') return { ...token };\n"
              "          const key = stateKey(token.char, skill);\n"
              "          if (!eligibleKeys.has(key) || used.has(key)) return { ...token, type: 'text' };\n"
              "          used.add(key);\n"
              "          return { ...token, type: 'blank' };\n"
              "        });\n"
              "        if (!tokens.some(token => token.type === 'blank')) continue;\n"
              "        queue.push({ ...question, tokens, lesson, courseKey: lesson.key, skill });\n"
          )
          new_queue = (
              "        const skill = skillOfQuestion(question);\n"
              "        const questionKeys = new Set(\n"
              "          question.tokens\n"
              "            .filter(token => token.type === 'blank')\n"
              "            .map(token => stateKey(token.char, skill))\n"
              "            .filter(key => eligibleKeys.has(key) && !used.has(key))\n"
              "        );\n"
              "        const tokens = question.tokens.map(token => {\n"
              "          if (token.type !== 'blank') return { ...token };\n"
              "          const key = stateKey(token.char, skill);\n"
              "          return { ...token, type: questionKeys.has(key) ? 'blank' : 'text' };\n"
              "        });\n"
              "        if (!tokens.some(token => token.type === 'blank')) continue;\n"
              "        questionKeys.forEach(key => used.add(key));\n"
              "        queue.push({ ...question, tokens, lesson, courseKey: lesson.key, skill });\n"
          )

          old_record = (
              "  async function recordWriterResult(ws, result) {\n"
              "    if (ws.recorded) return;\n"
              "    ws.recorded = true;\n"
              "    try {\n"
              "      await recordReview({ char: ws.token.char, skill: ws.question.skill, courseKey: ws.question.courseKey, result, mode: state.practiceMode });\n"
              "    } catch (err) {\n"
              "      console.error(err);\n"
              "      els.quizMessage.textContent = '作答完成，但學習紀錄儲存失敗。';\n"
              "    }\n"
              "  }\n"
          )
          new_record = (
              "  async function recordWriterResult(ws, result) {\n"
              "    if (ws.recorded) return;\n"
              "    if (result === 'fail') ws.failed = true;\n"
              "    ws.recorded = true;\n"
              "    const sameCharStates = state.writerStates.filter(item =>\n"
              "      item.question === ws.question && item.token.char === ws.token.char\n"
              "    );\n"
              "    if (!sameCharStates.every(item => item.recorded)) return;\n"
              "    const groupedResult = sameCharStates.some(item => item.failed) ? 'fail' : 'pass';\n"
              "    try {\n"
              "      await recordReview({ char: ws.token.char, skill: ws.question.skill, courseKey: ws.question.courseKey, result: groupedResult, mode: state.practiceMode });\n"
              "    } catch (err) {\n"
              "      console.error(err);\n"
              "      els.quizMessage.textContent = '作答完成，但學習紀錄儲存失敗。';\n"
              "    }\n"
              "  }\n"
          )

          if old_queue not in text:
              raise SystemExit('Expected buildQueue block not found; refusing to patch.')
          if old_record not in text:
              raise SystemExit('Expected recordWriterResult block not found; refusing to patch.')

          text = text.replace(old_queue, new_queue, 1)
          text = text.replace(old_record, new_record, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: JavaScript syntax check
        shell: bash
        run: node --check assets/app.js

      - name: Verify duplicate grouping patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('assets/app.js').read_text(encoding='utf-8')
          assert 'const questionKeys = new Set(' in text
          assert 'questionKeys.forEach(key => used.add(key));' in text
          assert 'const sameCharStates = state.writerStates.filter' in text
          assert "const groupedResult = sameCharStates.some(item => item.failed) ? 'fail' : 'pass';" in text
          print('duplicate blank grouping patch verified')
          PY

      - name: Commit runtime fix
        shell: bash
        run: |
          if git diff --quiet -- assets/app.js; then
            echo 'No runtime changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js
          git commit -m 'fix repeated blank characters within one question'
          git push origin HEAD:main
