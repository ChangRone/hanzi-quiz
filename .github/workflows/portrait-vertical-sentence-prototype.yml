name: One-time portrait vertical sentence prototype

on:
  push:
    paths:
      - '.github/workflows/portrait-vertical-sentence-prototype.yml'
      - '.github/scripts/portrait_vertical_sentence_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch portrait Quiz layout
        run: python3 .github/scripts/portrait_vertical_sentence_patch.py

      - name: Validate CSS diff
        run: |
          git diff --check
          grep -q "writing-mode: vertical-rl" assets/app.css
          grep -q -- "--portrait-scroll-gutter: 34px" assets/app.css
          grep -q "grid-template-columns: var(--portrait-prompt-width)" assets/app.css

      - name: Commit prototype
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.css
          git commit -m 'prototype vertical sentence beside mobile writing area'
          git push
