name: One-time zhuyin correction and vertical layout

on:
  push:
    paths:
      - '.github/scripts/fix_zhuyin_vertical_layout.py'
      - '.github/workflows/fix-zhuyin-vertical-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply data and UI patch
        run: python3 .github/scripts/fix_zhuyin_vertical_layout.py

      - name: Validate changes
        run: |
          git diff --check
          grep -R '蝴蝶忙著採花蜜' packs >/dev/null
          grep -R 'ㄓㄜ˙' packs >/dev/null
          grep -q 'function renderZhuyin(zhuyin)' assets/app.js
          grep -q 'Textbook-style vertical Bopomofo' assets/app.css

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packs assets/app.js assets/app.css
          git commit -m 'fix zhuyin reading and vertical bopomofo layout'
          git push
