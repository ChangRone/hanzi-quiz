name: One-time Quiz interaction behavior fix

on:
  push:
    paths:
      - '.github/workflows/quiz-ux-behavior-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Quiz behavior
        run: python3 .github/scripts/quiz_ux_patch.py

      - name: Validate JavaScript and diff
        run: |
          node --check assets/app.js
          git diff --check
          grep -q "known-lesson-vocab" assets/app.js
          grep -q "markStrokeCorrectAfterMisses: false" assets/app.js
          grep -q "question-loading" index.html

      - name: Commit patched behavior
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/app.css index.html
          git commit -m "fix Quiz hints, learned chars, speech loading, and default selection"
          git push
