name: One-time speech startup, prompt zoom, and pronunciation fix

on:
  push:
    paths:
      - '.github/scripts/fix_speech_zoom_pronunciation.py'
      - '.github/workflows/fix-speech-zoom-pronunciation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply speech, zoom, and pronunciation patch
        run: python3 .github/scripts/fix_speech_zoom_pronunciation.py

      - name: Validate implementation
        run: |
          git diff --check
          node --check assets/app.js
          grep -R '起司' packs | grep '吐司' >/dev/null
          grep -R 'ㄐㄧㄚˊ' packs >/dev/null
          grep -q 'question-zoom-button' index.html
          grep -q 'function getTaiwanSpeechVoice()' assets/app.js
          grep -q 'setTimeout(() =>' assets/app.js
          grep -q '#quiz-view.question-zoomed .question-card' assets/app.css

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packs index.html assets/app.js assets/app.css
          git commit -m 'fix speech startup, pronunciation data, and portrait prompt zoom'
          git push
