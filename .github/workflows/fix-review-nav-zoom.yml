name: Fix review queue navigation and portrait zoom

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_review_nav_zoom.py'
      - '.github/workflows/fix-review-nav-zoom.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Quiz behavior
        run: python3 .github/scripts/fix_review_nav_zoom.py

      - name: Validate JavaScript syntax
        run: node --check assets/app.js

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js assets/app.css
          git diff --cached --check
          git commit -m 'fix total review completeness and next navigation'
          git push
