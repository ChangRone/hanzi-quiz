name: Validate Kangxuan G2 Dictation Quiz v2

on:
  push:
    branches:
      - feature-kangxuan-g2-dictation-v2
    paths:
      - 'packs/2026康軒小二上-*.json'
      - '.github/workflows/m2-a2-validate-kangxuan-g2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate merged packs
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root=Path('packs')
          ids=set()
          totals={'base':0,'direct':0,'generalization':0,'all':0}
          expected={1:38,2:36,3:40,4:44,5:48,6:42,7:40,8:38,9:42,10:42,11:44,12:38}
          for n in range(1,13):
              p=root/f'2026康軒小二上-{n:02d}.json'
              d=json.loads(p.read_text(encoding='utf-8'))
              assert d['version']=='2.0.0', p
              assert d.get('catalog',{}).get('included') is True, p
              qs=d['questions']
              assert len(qs)==expected[n], (p,len(qs),expected[n])
              for q in qs:
                  qid=str(q['id'])
                  assert re.fullmatch(r'\d{12}',qid), qid
                  assert qid not in ids, qid
                  ids.add(qid)
                  assert ''.join(t['char'] for t in q['tokens'])==q['readText'], qid
                  assert all(t.get('zhuyin') for t in q['tokens']), qid
                  assert any(t.get('type')=='blank' for t in q['tokens']), qid
                  qn=int(qid[-2:])
                  if qn<=10:
                      totals['base']+=1
                  elif 11<=qn<=39:
                      assert q.get('questionType')=='direct_dictation', qid
                      span=q['requiredSpan']
                      assert q['readText']==span, qid
                      assert all(t['type']=='blank' for t in q['tokens']), qid
                      totals['direct']+=1
                  elif 51<=qn<=79:
                      assert q.get('questionType')=='dictation_generalization', qid
                      span=q['requiredSpan']
                      assert q['readText'].count(span)==1, qid
                      start=q['readText'].index(span)
                      blank=''.join(t['char'] for t in q['tokens'] if t['type']=='blank')
                      assert blank==span, (qid,blank,span)
                      for i,t in enumerate(q['tokens']):
                          expected_type='blank' if start<=i<start+len(span) else 'text'
                          assert t['type']==expected_type,(qid,i,t['type'],expected_type)
                      totals['generalization']+=1
                  else:
                      raise AssertionError('unexpected question range '+qid)
                  totals['all']+=1
          assert totals=={'base':120,'direct':186,'generalization':186,'all':492}, totals
          print('M2_A2_PACK_VALIDATE=PASS',totals)
          PY

      - name: Rebuild and validate Catalog v2
        run: |
          node tools/catalog/build-catalog-v2.mjs
          node tools/catalog/validate-catalog-v2.mjs
          node --check assets/app.js
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('quiz-catalog-v2.json').read_text(encoding='utf-8'))
          rows=[x for x in c['lessons'] if x['packId']=='20262020']
          assert len(rows)==12
          assert sum(x['questionCount'] for x in rows)==492
          assert all(x['version']=='2.0.0' for x in rows)
          print('M2_A2_CATALOG_VALIDATE=PASS lessons=',len(rows),'questions=',sum(x['questionCount'] for x in rows))
          PY

      - name: Commit refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quiz-catalog-v2.json
          if git diff --cached --quiet; then
            echo 'Catalog already current.'
            exit 0
          fi
          git commit -m 'build: refresh Quiz Catalog v2 for 康軒二上'
          git push origin HEAD:${GITHUB_REF_NAME}
