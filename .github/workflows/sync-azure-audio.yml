name: Sync Azure audio from Lab

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-azure-audio-from-lab
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quiz
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Lab audio source
        uses: actions/checkout@v4
        with:
          repository: ChangRone/hanzi-writing-lab
          ref: main
          path: .cache/hanzi-writing-lab
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize validated MP3
        run: python3 tools/audio/sync_from_lab.py --lab-dir .cache/hanzi-writing-lab

      - name: Validate Quiz audio tree
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/audio/v1/manifest.json')
          assert p.exists(), 'local audio manifest missing'
          m=json.loads(p.read_text(encoding='utf-8'))
          assert m['schema']=='hanzi-quiz-local-audio-v1'
          assert m['voice']=='zh-TW-HsiaoChenNeural'
          assert m['mode']=='verified-partial'
          assert m['rate']=='-12%'
          count=int(m['questionCount'])
          assert count>0
          audio=Path('assets/audio/v1/audio')
          files=list(audio.glob('*.mp3'))
          assert len(files)==count, (len(files),count)
          assert all(x.stat().st_size>500 for x in files)
          assert len(m['files'])==count
          print('QUIZ_LOCAL_AUDIO_VALIDATE=PASS sourceLabCommit=',m['sourceLabCommit'])
          PY
          git diff --check

      - name: Commit Quiz-local MP3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/v1
          if git diff --cached --quiet -- assets/audio/v1; then
            echo 'Quiz audio already synchronized.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'build: sync Azure MP3 from hanzi-writing-lab'
          git push
