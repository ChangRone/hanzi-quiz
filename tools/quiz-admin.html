<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hanzi Quiz 開發者設定</title>
  <style>
    body{font-family:"Microsoft JhengHei",system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0;padding:20px}.wrap{max-width:720px;margin:auto;background:white;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(32,45,72,.08)}label{display:block;font-weight:700;margin:16px 0 6px}input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #dbe2ec}input[type=text],input[type=number],select{width:100%}button{border:0;background:#e9873d;color:white;font-weight:800;margin-top:18px}.note{color:#687386;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style>
</head>
<body>
  <div class="wrap">
    <h1>Quiz 開發者設定</h1>
    <p class="note">一般使用者不需要進入本頁。這些設定保留給字形判定測試與快速調整，正式 Quiz 首頁不顯示工程參數。</p>
    <div class="row"><div><label>leniency</label><input id="leniency" type="number" min="0.5" max="2" step="0.1"></div><div><label>drawingWidth</label><input id="drawingWidth" type="number" min="4" max="24" step="1"></div></div>
    <div class="row"><div><label>完成高亮</label><select id="highlight"><option value="true">是</option><option value="false">否</option></select></div><div><label>失誤幾次後自動判過該筆</label><input id="markCorrect" type="number" min="2" max="8" step="1"></div></div>
    <label>自訂字庫優先</label><select id="customFirst"><option value="false">否</option><option value="true">是</option></select>
    <label>自訂字庫路徑樣板</label><input id="customTemplate" type="text" placeholder="char-data/{char}.json">
    <button id="save">儲存開發者設定</button>
    <p id="status" class="note"></p>
    <p class="note"><a href="../index.html">返回 Quiz</a></p>
  </div>
<script>
const defaults={leniency:1.4,drawingWidth:18,highlightOnComplete:true,markStrokeCorrectAfterMisses:4,customCharDataTemplate:'',customCharDataFirst:false};
let current={...defaults};try{current={...defaults,...JSON.parse(localStorage.getItem('hanziQuizDevSettings')||'{}')}}catch{}
leniency.value=current.leniency;drawingWidth.value=current.drawingWidth;highlight.value=String(current.highlightOnComplete);markCorrect.value=current.markStrokeCorrectAfterMisses;customFirst.value=String(current.customCharDataFirst);customTemplate.value=current.customCharDataTemplate||'';
save.onclick=()=>{const next={leniency:Number(leniency.value)||1.4,drawingWidth:Number(drawingWidth.value)||18,highlightOnComplete:highlight.value==='true',markStrokeCorrectAfterMisses:Number(markCorrect.value)||4,customCharDataFirst:customFirst.value==='true',customCharDataTemplate:customTemplate.value.trim()};localStorage.setItem('hanziQuizDevSettings',JSON.stringify(next));status.textContent='已儲存。重新開啟 Quiz 後套用。';};
</script>
</body>
</html>
